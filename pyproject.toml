[project]
name = "virtuosov2"
version = "0.2.0"
description = "Predictive Coding 局部动态小语言模型 — 统一 PC + 多巴胺 + QAT + 持续学习"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.0",
    "numpy>=2.4.5",
    "torchao>=0.17.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=1.13.0",
    "typer>=0.15.0",
    "matplotlib>=3.10.9",
    "requests>=2.34.2",
    "pillow>=12.2.0",
    "maliang>=3.1.5",
    "PyQt6>=6.8.0",
]

[project.scripts]
virtuoso = "cli.app:app"

[tool.setuptools.packages.find]
include = [
    "cli", "cli.*",
    "core", "core.*",
    "model", "model.*",
    "continual", "continual.*",
    "dataset", "dataset.*",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]


[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132"
explicit = true


[tool.basedpyright]
typeCheckingMode = "standard"
reportPrivateImportUsage = "none"


[tool.ruff]
line-length = 88
target-version = "py312"

lint.select = [
    "F",   # Pyflakes — 未定义变量、未使用导入/变量等真正错误
    "E",   # pycodestyle 错误 — 基本风格问题（缩进、空行等）
    "I",   # isort — 导入排序
    "D",   # pydocstyle — 文档字符串规范（配合 Google 风格）
]

lint.per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["alm", "col", "training", "scripts"]

[tool.ruff.format]
quote-style = "double"

